<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B3D">
<title>Kashiani G.C. Pilot High School — Services Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FB;--surface:#FFFFFF;--ink:#0F1B3D;--mut:#64708F;--line:#E3E8F3;
  --brand:#2F5BFF;--brand2:#7A5CFF;--gold:#F2B544;--ring:rgba(47,91,255,.35);
  --shadow:0 1px 2px rgba(15,27,61,.06),0 8px 24px rgba(15,27,61,.06);
  --shadow-h:0 2px 4px rgba(15,27,61,.08),0 16px 40px rgba(47,91,255,.16);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A1022;--surface:#121A33;--ink:#EEF2FF;--mut:#97A3C4;--line:#222D4F;
  --ring:rgba(122,150,255,.5);--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-h:0 16px 40px rgba(0,0,0,.45)}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Plus Jakarta Sans','Noto Sans Bengali',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1060px;margin:0 auto;padding:0 18px}

/* ---------- hero ---------- */
.hero{position:relative;color:#fff;background:radial-gradient(1200px 500px at 85% -10%,#7A5CFF55,transparent 60%),radial-gradient(900px 400px at 0% 110%,#2F5BFF66,transparent 60%),#0F1B3D;padding:calc(env(safe-area-inset-top) + 22px) 0 70px;border-radius:0 0 32px 32px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:linear-gradient(135deg,var(--gold),#FF8A5B);box-shadow:0 6px 18px rgba(242,181,68,.35)}
.brand b{display:block;font-weight:700;font-size:15px;line-height:1.2}
.brand small{color:#AAB6DA;font-size:12px}
.clock{text-align:right;font-size:12.5px;color:#AAB6DA;white-space:nowrap}
.clock b{display:block;color:#fff;font-size:18px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
h1{margin:34px 0 4px;font-size:clamp(28px,6vw,44px);line-height:1.1;font-weight:800;letter-spacing:-.03em}
.sub{margin:0;color:#B9C4E6;max-width:46ch}
.search{position:relative;margin-top:24px;max-width:560px}
.search svg{position:absolute;left:16px;top:50%;translate:0 -50%;width:20px;height:20px;stroke:#AAB6DA;fill:none;stroke-width:2;stroke-linecap:round}
.search input{width:100%;font:inherit;color:#fff;padding:15px 64px 15px 46px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.search input::placeholder{color:#AAB6DA}
.search input:focus{outline:none;border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.15)}
.search kbd{position:absolute;right:14px;top:50%;translate:0 -50%;font:600 12px inherit;color:#C6D0EE;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:2px 8px}

/* ---------- body ---------- */
main{margin-top:-34px;padding-bottom:36px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--mut);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
.pills button:hover{color:var(--ink)}
.pills button[aria-pressed=true]{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--brand),var(--brand2))}
.pills button:focus-visible,.tile:focus-visible{outline:3px solid var(--ring);outline-offset:2px}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:14px;padding:18px;color:inherit;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s;min-height:160px}
a.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:transparent}
.tile.wide{grid-column:span 2;grid-row:span 1;color:#fff;border:0;background:linear-gradient(135deg,#2F5BFF,#7A5CFF 70%,#B05CFF)}
.tile.wide .tx span{color:#E1E6FF}
.tile.wide .ic{background:rgba(255,255,255,.2);color:#fff}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:var(--c,#EEF2FF)}
.tx b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.tx span{display:block;margin-top:3px;color:var(--mut);font-size:13.5px}
.meta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600}
.badge{padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--mut)}
.wide .badge{background:rgba(255,255,255,.2);color:#fff}
.arrow{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg);transition:.18s}
.arrow svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.wide .arrow{background:rgba(255,255,255,.22)}
a.tile:hover .arrow{background:var(--brand);color:#fff;translate:3px 0}
.soon{opacity:.6;border-style:dashed;box-shadow:none}
.group{margin:24px 4px 10px;font-size:13px;font-weight:700;color:var(--mut)}
.empty{grid-column:1/-1;text-align:center;padding:44px 16px;color:var(--mut);background:var(--surface);border:1px dashed var(--line);border-radius:22px}
footer{padding:0 0 30px;color:var(--mut);font-size:12.5px;text-align:center}

/* one entrance only: tiles rise in once on load */
@media (prefers-reduced-motion:no-preference){.grid.in .tile{animation:up .45s both}.grid.in .tile:nth-child(2){animation-delay:.05s}.grid.in .tile:nth-child(3){animation-delay:.1s}.grid.in .tile:nth-child(4){animation-delay:.15s}.grid.in .tile:nth-child(n+5){animation-delay:.2s}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}

@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.grid{grid-template-columns:1fr}.tile.wide{grid-column:auto}.tile{min-height:0}.clock{display:none}.hero{border-radius:0 0 24px 24px}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="bar">
    <div class="brand"><div class="logo">🎓</div><div><b>Kashiani G.C. Pilot High School</b><small>Kashiani, Gopalganj</small></div></div>
    <div class="clock" aria-hidden="true"><b id="time"></b><span id="date"></span></div>
  </div>
  <h1 id="hello">Welcome</h1>
  <p class="sub">Everything the school offers, in one place. Pick a service to get started.</p>
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search services — leave, marks…" aria-label="Search services" autocomplete="off">
    <kbd aria-hidden="true">/</kbd>
  </div>
</div></header>

<main class="wrap">
  <div class="pills" id="pills" role="group" aria-label="Filter by category"></div>
  <div id="out"></div>
</main>
<footer class="wrap">Add a service by adding one line to the SERVICES list at the bottom of this file.</footer>

<script>
// ===== Edit this list to add / change services =====
// feature:true makes a tile wide · omit url to show a "Soon" tile · c: icon background colour
const LINK_SITE = "https://link-kashianigcpilothighschool.vercel.app";
const SERVICES = [
  { cat: "Academics", icon: "📝", c: "#E7EDFF", name: "Marksheet", desc: "Enter subject-wise marks, see GPA instantly, then print or save as PDF.", url: "marksheet_en.html", tag: "Teachers", feature: true },
  { cat: "Academics", icon: "🏆", c: "#FFF1D6", name: "Results", desc: "Published exam results.", tag: "Soon" },
  { cat: "Academics", icon: "🗓️", c: "#E3F6EC", name: "Attendance", desc: "Daily student attendance.", tag: "Soon" },
  { cat: "Staff", icon: "🌴", c: "#FFE6E0", name: "Casual leave", desc: "Apply for leave and check its status.", url: LINK_SITE + "/search?q=casual-leave", tag: "Staff" },
  { cat: "Staff", icon: "🔗", c: "#EDE6FF", name: "All school links", desc: "Every service on the school Link site.", url: LINK_SITE + "/", tag: "Link site" },
  { cat: "Notices", icon: "📢", c: "#DFF3FA", name: "Notices", desc: "School announcements and circulars.", tag: "Soon" }
];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cats = ["All", ...new Set(SERVICES.map((s) => s.cat))];
let cat = "All", first = true;

// greeting + clock
function tick() {
  const d = new Date(), h = d.getHours();
  $("hello").textContent = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
  $("time").textContent = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  $("date").textContent = d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}
tick(); setInterval(tick, 30000);

$("pills").innerHTML = cats.map((c) => `<button type="button" data-c="${esc(c)}" aria-pressed="${c === "All"}">${esc(c)}</button>`).join("");
$("pills").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  cat = b.dataset.c; [...$("pills").children].forEach((x) => x.setAttribute("aria-pressed", x === b)); draw();
});
$("q").addEventListener("input", draw);
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape") { $("q").value = ""; $("q").blur(); draw(); }
});

const ARROW = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
function tile(s) {
  const body = `<span class="ic" style="--c:${s.c || "#EEF2FF"}" aria-hidden="true">${s.icon}</span>
    <span class="tx"><b>${esc(s.name)}</b><span>${esc(s.desc)}</span></span>
    <span class="meta"><span class="badge">${esc(s.tag || s.cat)}</span>${s.url ? `<span class="arrow" aria-hidden="true">${ARROW}</span>` : ""}</span>`;
  const cls = "tile" + (s.feature && s.url ? " wide" : "") + (s.url ? "" : " soon");
  return s.url ? `<a class="${cls}" href="${esc(s.url)}">${body}</a>` : `<div class="${cls}" aria-disabled="true">${body}</div>`;
}
function draw() {
  const q = $("q").value.trim().toLowerCase();
  const hit = SERVICES.filter((s) => (cat === "All" || s.cat === cat) && (!q || (s.name + " " + s.desc + " " + s.cat + " " + (s.tag || "")).toLowerCase().includes(q)));
  const g = (items) => `<div class="grid${first ? " in" : ""}">${items.map(tile).join("")}</div>`;
  if (!hit.length) { $("out").innerHTML = '<div class="grid"><div class="empty"><b>No matching service</b><br>Clear the search or choose another category.</div></div>'; return; }
  $("out").innerHTML = cat === "All" && !q
    ? [...new Set(hit.map((s) => s.cat))].map((c) => `<div class="group">${esc(c)}</div>${g(hit.filter((s) => s.cat === c))}`).join("")
    : g(hit);
  first = false;
}
draw();
</script>
</body>
</html>
